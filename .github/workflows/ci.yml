name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, audit, config, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdef0123456789abcdef
      TEST_USE_POSTGRES: "true"
      POSTGRES_DB: nexora_test
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt
          pip install pip-audit

      # L-12: dependency vulnerability scanning. The runtime requirement set
      # is blocking — it ships to production and parses untrusted uploads.
      # The development set (test tooling) reports without failing the build;
      # failures still surface as visible annotations on the step.
      - name: Audit runtime dependencies (blocking)
        run: pip-audit --progress-spinner off -r requirements/production.txt

      - name: Audit development dependencies (informational)
        run: pip-audit --progress-spinner off -r requirements/development.txt
        continue-on-error: true

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Validate configuration
        run: python manage.py check

      - name: Fail on missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (against PostgreSQL)
        run: python -m pytest -v

  frontend:
    name: Frontend (audit, lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # L-12: npm audit against the lockfile. Production dependencies are
      # blocking at high/critical severity; the full report (including dev
      # tooling such as eslint/vite/typescript) stays informational so that
      # advisory noise from build-only packages does not gate merges.
      - name: Audit runtime dependencies (blocking on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies incl. dev tooling (informational)
        run: npm audit
        continue-on-error: true

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check & build
        run: npm run build

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The local eslint hook shells out to `npm run lint`, which requires
      # node_modules; install exactly what the lockfile pins.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (eslint hook)
        run: npm ci
        working-directory: frontend

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend, pre-commit]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
