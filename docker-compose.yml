name: nexora

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # L-8: Redis requires authentication. The default is a well-known
    # development password so `docker compose up` works out of the box; set
    # REDIS_PASSWORD in .env (strong value) for anything exposed beyond the
    # internal Docker network. Redis itself is never port-published.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-nexora-dev-redis}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexora-dev-redis}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      POSTGRES_HOST: postgres
      # L-8: credentials are injected into the URLs from REDIS_PASSWORD so the
      # cache, broker and health probe all authenticate consistently.
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/0
    volumes:
      - media_data:/app/media
    # L-9: no host port. The backend is reachable only over the internal
    # Docker network; nginx (port 80) is the single public edge.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/0
    command:
      ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nexora-dev-redis}@redis:6379/0
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/security-headers-backend.conf:/etc/nginx/snippets/security-headers-backend.conf:ro
      # Read-only view of uploads: nginx serves them, never writes.
      - media_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
