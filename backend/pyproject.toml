[project]
name = "nexora-backend"
version = "0.1.0"
description = "Nexora B2B SaaS platform - Django backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    # DRF/Django rely on mutable class attributes (filterset_fields, etc.);
    # wrapping them in ClassVar would be unidiomatic.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Class-based settings modules intentionally re-export configuration.
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
