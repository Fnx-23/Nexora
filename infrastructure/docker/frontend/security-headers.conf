# L-11: baseline security headers for every SPA response.
#
# CSP notes (kept compatible with the Vite production build):
#   - index.html references only external module scripts and stylesheets
#     from /assets/, so script-src/style-src need no 'unsafe-eval'/'unsafe-inline'
#     for scripts; style-src keeps 'unsafe-inline' because Tailwind-driven UI
#     libraries may inject <style> tags at runtime.
#   - The SPA is same-origin only: API calls go to /api/v1 on the same host,
#     avatars/media load from /media/ ('self'), favicon is same-origin.
#   - data:/blob: img-src covers encoded previews without weakening scripts.
#   - frame-ancestors 'none' plus X-Frame-Options DENY blocks embedding.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
