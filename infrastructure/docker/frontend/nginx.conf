server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached aggressively. Security headers are
    # repeated here because nginx add_header directives do not inherit into a
    # location once that location declares any add_header of its own.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # L-11: SPA responses carry the baseline security headers (HSTS is added
    # by the TLS-terminating layer only when HTTPS is actually in use).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
