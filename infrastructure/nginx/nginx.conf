worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    upstream backend_service {
        server backend:8000;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # HSTS is deliberately NOT sent here: this listener may serve plain
        # HTTP in development, and HSTS must only be advertised when HTTPS
        # is guaranteed (the TLS-terminating layer adds it domain-wide).

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L-11: baseline headers for backend-proxied responses, applied per
        # location (nginx does not inherit add_header into locations that
        # declare their own). The SPA (/ -> frontend) is excluded on purpose:
        # the frontend image ships its own complete set including CSP, and
        # duplicating them at the edge would send every header twice.
        location /api/ {
            include /etc/nginx/snippets/security-headers-backend.conf;
            proxy_pass http://backend_service;
        }

        location /admin/ {
            include /etc/nginx/snippets/security-headers-backend.conf;
            proxy_pass http://backend_service;
        }

        # Django admin assets (WhiteNoise) — static handling unchanged.
        location /static/ {
            include /etc/nginx/snippets/security-headers-backend.conf;
            proxy_pass http://backend_service;
        }

        location = /healthz/ {
            include /etc/nginx/snippets/security-headers-backend.conf;
            proxy_pass http://backend_service;
        }

        # Uploaded media is served straight from the shared volume instead of
        # being routed through Django. Only validated raster uploads are
        # exposed; everything else (dotfiles, scripts, unknown types) is 403.
        # Headers sandbox the response so even a smuggled polyglot file cannot
        # execute in a browser context:
        #   - nosniff        pins the Content-Type nginx derived from the
        #                     (allow-listed) extension; the browser may not
        #                     re-interpret the bytes as HTML/JS.
        #   - CSP none        neutralises any active content in a served file.
        #   - Disposition inline  images render in <img>, but are never treated
        #                     as a top-level document that could script.
        location /media/ {
            alias /var/www/media/;
            try_files $uri =404;

            if ($uri !~* \.(jpe?g|png|webp)$) {
                return 403;
            }

            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
            add_header X-Frame-Options DENY always;
            add_header Content-Disposition "inline" always;
        }

        location / {
            proxy_pass http://frontend_service;
        }
    }
}
