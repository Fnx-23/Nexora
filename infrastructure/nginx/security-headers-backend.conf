# L-11: baseline hardening for responses proxied to the backend
# (/api/, /admin/, /static/, /healthz/). Included per location because nginx
# add_header directives do not inherit into locations that declare any of
# their own. The SPA location does not use this snippet: the frontend image
# ships its own complete set (including CSP); HSTS belongs to the TLS layer.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
